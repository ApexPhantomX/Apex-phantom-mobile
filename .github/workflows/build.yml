name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK oluştur
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk ApexPhantom.apk

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Apex Phantom (sürüm ${{ github.run_number }})
          body: Telefona indirip kurmak için aşağıdaki ApexPhantom.apk dosyasına dokun.
          files: ApexPhantom.apk
          make_latest: true
