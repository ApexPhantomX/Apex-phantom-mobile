name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK oluştur
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build-output.txt

      - name: Hata kaydını depoya yaz
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|Caused by|> " build-output.txt | head -200 > hata.txt || true
          echo "----- son 150 satır -----" >> hata.txt
          tail -150 build-output.txt >> hata.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add hata.txt
          git commit -m "Derleme hatası (çalışma ${{ github.run_number }})"
          git push -f origin build-log

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk ApexPhantom.apk

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Apex Phantom (sürüm ${{ github.run_number }})
          body: Telefona indirip kurmak için aşağıdaki ApexPhantom.apk dosyasına dokun.
          files: ApexPhantom.apk
          make_latest: true
